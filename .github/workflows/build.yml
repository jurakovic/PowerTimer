name: Build

# Builds Power Timer and runs the tests for every push and pull request.
# Releases are made with the Publish workflow, see publish.yml.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lazarus

      - name: Build tests
        run: lazbuild tests/PowerTimerTests.lpi

      - name: Run tests
        run: ./tests/bin/x86_64-win64/PowerTimerTests.exe

      - name: Build Power Timer
        run: lazbuild --build-mode=Release src/PowerTimer.lpi

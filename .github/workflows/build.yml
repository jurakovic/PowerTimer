name: Build

# Builds Power Timer, runs the tests and uploads PowerTimer.exe, zipped as
# PowerTimer_v<version>_win-x64 like the release, for pushes to master that
# change the application, its tests or how they are built, and when run from
# the Actions tab ("Run workflow", for any branch).
#
# The version of PowerTimer.exe is <next release>-build.<run number>, e.g.
# 1.0.1-build.42: the version that the Publish workflow would release from
# master next, marked as a pre-release of it. Releases are made with the
# Publish workflow, see publish.yml.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'publish.sh'
      # Line endings of publish.sh on the Windows runner
      - '.gitattributes'
      - '.github/workflows/build.yml'
      - '.github/actions/setup-lazarus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is computed from the tags
          fetch-depth: 0

      - name: Compute version
        run: |
          if ! NEXT=$(./publish.sh version -p false); then
            echo "$NEXT"
            echo "::error::Could not compute the version"
            exit 1
          fi
          echo "VERSION=$NEXT-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-lazarus

      # Runs the tests and builds PowerTimer.exe with the version, the same
      # way as releases are built
      - name: Build and test
        run: ./publish.sh build -v "$VERSION" -u true

      # Named like the release's zip, which it matches when downloaded:
      # PowerTimer_v<version>_win-x64.zip with PowerTimer.exe inside
      - name: Upload PowerTimer.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PowerTimer_v${{ env.VERSION }}_win-x64
          path: src/bin/x86_64-win64/PowerTimer.exe
          if-no-files-found: error

      - name: Summary
        run: echo "### Power Timer $VERSION" >> "$GITHUB_STEP_SUMMARY"
